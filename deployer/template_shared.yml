services:
    webserver:
        container_name: $DOMAIN_FILE-$WP_container_name
        image: $WP_image
        ports:
            - $WP_portOut:$WP_portIn
        expose:
            - $WP_portOut
        volumes:
            - $WP_volumePath
            - $WP_apacheConfPath
            - $WP_mpmConfPath
            - $WP_phpConfPath
        restart: always
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        labels:
            - "CONF_GROUP=$CONF_GROUP"
            - "wpdeployer.site=$DOMAIN_FILE"
            - "wpdeployer.service=wordpress"
            - "wpdeployer.logs=$LOGS_enabled"
            - "wpdeployer.dbgroup=$DB_group"
        environment:
            WORDPRESS_DEBUG: "$WP_debug"
            WORDPRESS_CONFIG_EXTRA: "$WP_configExtra"
            WORDPRESS_DB_HOST: $DB_host
            WORDPRESS_DB_USER: $DB_user
            WORDPRESS_DB_NAME: $DB_name
            WORDPRESS_DB_PASSWORD: $DB_pass
            VIRTUAL_HOST: $HOST_domainsDeclaration
            LETSENCRYPT_HOST: $HOST_domainsDeclaration
            LETSENCRYPT_EMAIL: hubert.sobkow@gmail.com
        networks:
            - proxy
            - wpdb

networks:
    proxy:
        external: true
    wpdb:
        name: wpdb_$DB_group
        external: true
